name: LAWS Regulatory Radar & Briefing Dispatch

on:
  schedule:
    # Run twice weekly (Mondays & Thursdays at 03:00 UTC)
    - cron: '0 3 * * 1,4'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  run-radar:
    name: Crawl Defense Preprints & Dispatch Briefing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Unit Tests
        run: |
          python -m unittest discover tests

      - name: Execute Radar Engine & Generate Briefing
        env:
          TARGET_EMAIL: "workwithavip@gmail.com"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/radar_engine.py

      - name: Commit Intelligence Briefing
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A briefings/
          git diff --staged --quiet || (git commit -m "chore(radar): archive latest defense AI regulatory briefing" && git push)
